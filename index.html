<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hemans Clothing Store</title>
<meta name="description" content="Hemans Clothing Store: everyday menswear, cut well and priced fairly. Cash on Delivery available.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== THEME: change these colours and fonts to restyle the whole site ===== */
:root{
  --paper:#F4F5F2;      /* page background */
  --ink:#16213A;        /* main text + dark buttons */
  --brass:#B88A2E;      /* accent colour */
  --stone:#E3E6E0;      /* borders, soft panels */
  --mute:#5D667A;       /* secondary text */
  --white:#fff;
  --danger:#B3261E;
  --display:'Bodoni Moda','Didot','Times New Roman',serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* Header */
header{position:sticky;top:0;z-index:20;background:rgba(244,245,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--stone)}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;text-decoration:none;color:var(--ink)}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:.62rem;letter-spacing:.2em;color:var(--mute);margin-top:-3px}
.nav{display:flex;align-items:center;gap:20px}
.nav a{color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:500}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--white);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem}
.cartbtn .n{background:var(--brass);color:var(--white);min-width:20px;height:20px;border-radius:10px;font-size:.72rem;display:grid;place-items:center;padding:0 5px}
@media(max-width:560px){.nav a{display:none}}

/* Hero */
.hero{padding:56px 0 40px;border-bottom:1px solid var(--stone)}
.hero-grid{display:grid;gap:32px;align-items:center}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,9vw,4.8rem);line-height:1.02;letter-spacing:-.01em}
.hero p{margin-top:18px;color:var(--mute);max-width:44ch;font-size:1.05rem}
.cta{display:inline-block;margin-top:26px;background:var(--ink);color:var(--white);padding:14px 28px;border-radius:999px;font-weight:600;text-decoration:none}
.cta:hover{background:#0d1528}
.hero-art{background:var(--stone);border-radius:6px;aspect-ratio:5/4;display:grid;place-items:center;overflow:hidden}
.hero-art svg{width:62%;height:auto}
.perks{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:28px;font-size:.85rem;color:var(--mute)}
@media(min-width:860px){.hero-grid{grid-template-columns:1.1fr .9fr}.hero{padding:80px 0 60px}}

/* Shop */
.shop{padding:48px 0 70px}
.shop-head{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:24px}
.shop h2{font-family:var(--display);font-size:clamp(1.7rem,5vw,2.4rem)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border:1px solid var(--stone);border-radius:999px;font-size:.85rem;font-weight:500;background:var(--white)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:22px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--white);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--stone)}
.pic{aspect-ratio:4/5;display:grid;place-items:center;position:relative}
.pic svg{width:70%;height:auto}
.pic img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;background:var(--brass);color:var(--white);font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:999px}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{font-size:.95rem;font-weight:600;line-height:1.3}
.price{font-weight:700}
.price s{color:var(--mute);font-weight:400;font-size:.85rem;margin-left:6px}
.sizes{display:flex;flex-wrap:wrap;gap:5px}
.sz{min-width:34px;height:30px;padding:0 8px;border:1px solid var(--stone);border-radius:4px;font-size:.78rem;font-weight:600}
.sz[aria-pressed=true]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.add{margin-top:auto;background:var(--brass);color:var(--white);padding:11px;border-radius:4px;font-weight:600;font-size:.88rem}
.add:hover{filter:brightness(.93)}

/* About + footer */
.about{background:var(--ink);color:var(--paper);padding:56px 0}
.about h2{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:14px}
.about p{max-width:60ch;opacity:.85}
footer{padding:28px 0 40px;font-size:.85rem;color:var(--mute)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* Drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--stone)}
.dh h2{font-family:var(--display);font-size:1.3rem}
.x{font-size:1.6rem;line-height:1;padding:4px 8px}
.lines{flex:1;overflow:auto;padding:8px 18px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--stone);align-items:center}
.line .t{width:64px;aspect-ratio:4/5;border-radius:4px;display:grid;place-items:center;overflow:hidden}
.line .t svg{width:74%}
.line .t img{width:100%;height:100%;object-fit:cover}
.line h4{font-size:.9rem;font-weight:600}
.line small{color:var(--mute)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--stone);border-radius:4px;margin-top:6px;background:var(--white)}
.qty button{width:30px;height:28px;font-size:1rem}
.qty span{min-width:26px;text-align:center;font-size:.85rem;font-weight:600}
.rm{color:var(--danger);font-size:.78rem;display:block;margin-top:6px;text-align:right}
.empty{padding:50px 10px;text-align:center;color:var(--mute)}
.df{padding:16px 18px;border-top:1px solid var(--stone);background:var(--white)}
.row{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}
.row.tot{font-weight:700;font-size:1.05rem;margin:10px 0 14px}
.btn{display:block;width:100%;background:var(--ink);color:var(--white);padding:14px;border-radius:999px;font-weight:600;text-align:center;text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#1F9D55}

.modal{position:fixed;inset:0;z-index:60;display:none;overflow:auto;background:var(--paper)}
.modal.on{display:block}
.co{max-width:960px;margin:0 auto;padding:18px 18px 50px}
.co-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.co-top h2{font-family:var(--display);font-size:1.7rem}
.co-grid{display:grid;gap:24px}
@media(min-width:820px){.co-grid{grid-template-columns:1.2fr .8fr;align-items:start}}
form,.sum{background:var(--white);border:1px solid var(--stone);border-radius:6px;padding:20px}
.f{margin-bottom:14px}
.f label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px}
.f input,.f textarea{width:100%;padding:12px;border:1px solid #c9cec6;border-radius:4px;background:var(--paper)}
.f input:focus,.f textarea:focus{border-color:var(--ink);outline:none}
.f.bad input,.f.bad textarea{border-color:var(--danger)}
.err{display:none;color:var(--danger);font-size:.78rem;margin-top:4px}
.f.bad .err{display:block}
.two{display:grid;gap:14px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
fieldset{border:0;margin:6px 0 18px}
legend{font-size:.82rem;font-weight:600;margin-bottom:8px}
.pay{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--stone);border-radius:4px;padding:12px;margin-bottom:8px;cursor:pointer}
.pay input{margin-top:4px;accent-color:var(--ink)}
.pay.dis{opacity:.5;cursor:not-allowed}
.pay small{display:block;color:var(--mute)}
.sum h3{font-family:var(--display);font-size:1.2rem;margin-bottom:12px}
.si{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:6px 0;border-bottom:1px dashed var(--stone)}
.done{max-width:520px;margin:60px auto;text-align:center;padding:0 18px}
.done h2{font-family:var(--display);font-size:2rem;margin-bottom:10px}
.done p{color:var(--mute);margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--ink);color:var(--white);padding:11px 20px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hero-art{aspect-ratio:1/1}
.hero-art img{width:100%;height:100%;object-fit:cover}
.upi{border:1px solid var(--stone);border-radius:4px;padding:14px;margin-bottom:16px;background:var(--paper);text-align:center}
.upibtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.upibtns a{padding:10px;border-radius:4px;background:var(--ink);color:#fff;text-decoration:none;font-size:.85rem;font-weight:600}
.qr{width:210px;max-width:70%;background:#fff;padding:8px;border-radius:4px;border:1px solid var(--stone)}
.small{font-size:.8rem;color:var(--mute);margin-top:6px}
.copy{margin-top:10px;font-size:.8rem;border:1px solid var(--stone);border-radius:999px;padding:8px 14px;background:var(--white);word-break:break-all}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#top" id="logo"></a>
    <nav class="nav">
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
      <button class="cartbtn" id="openCart" aria-label="Open cart">Cart <span class="n" id="count">0</span></button>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <h1 id="heroTitle"></h1>
        <p id="heroText"></p>
        <a class="cta" href="#shop">Shop the collection</a>
        <div class="perks" id="perks"></div>
      </div>
      <div class="hero-art" id="heroArt" aria-hidden="true"></div>
    </div>
  </section>

  <section class="shop" id="shop">
    <div class="wrap">
      <div class="shop-head">
        <h2>The collection</h2>
        <div class="chips" id="chips"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap">
      <h2 id="aboutTitle"></h2>
      <p id="aboutText"></p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="foot1"></span>
    <span id="foot2"></span>
  </div>
</footer>

<!-- Cart drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart" aria-hidden="true">
  <div class="dh"><h2>Your cart</h2><button class="x" id="closeCart" aria-label="Close cart">&times;</button></div>
  <div class="lines" id="lines"></div>
  <div class="df" id="df"></div>
</aside>

<!-- Checkout -->
<div class="modal" id="checkout" role="dialog" aria-modal="true" aria-label="Checkout">
  <div class="co" id="coBody">
    <div class="co-top"><h2>Checkout</h2><button class="x" id="closeCo" aria-label="Close checkout">&times;</button></div>
    <div class="co-grid">
      <form id="form" novalidate>
        <div class="f"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required><div class="err">Enter your full name.</div></div>
        <div class="f"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit mobile number" required><div class="err">Enter a valid 10-digit phone number.</div></div>
        <div class="f"><label for="address">Delivery address</label><textarea id="address" name="address" rows="3" autocomplete="street-address" placeholder="House no., street, area, city, state" required></textarea><div class="err">Enter your full delivery address.</div></div>
        <div class="f"><label for="pin">Pincode</label><input id="pin" name="pin" inputmode="numeric" autocomplete="postal-code" maxlength="6" placeholder="6-digit pincode" required><div class="err">Enter a valid 6-digit pincode.</div></div>
        <fieldset>
          <legend>Payment method</legend>
          <label class="pay"><input type="radio" name="pay" value="COD" checked><span>Cash on Delivery<small>Pay in cash when your order arrives.</small></span></label>
          <label class="pay"><input type="radio" name="pay" value="UPI"><span>UPI (Google Pay, PhonePe, Paytm)<small>Pay now with a UPI app or QR code.</small></span></label>
          <label class="pay" id="payRzp"><input type="radio" name="pay" value="RAZORPAY"><span>Card, Net banking, Wallets<small>Secure payment by Razorpay.</small></span></label>
          <label class="pay" id="payPP"><input type="radio" name="pay" value="PAYPAL"><span>PayPal<small>Pay with your PayPal account.</small></span></label>
        </fieldset>
        <div id="payPanel"></div>
        <button class="btn" type="submit" id="submitBtn">Place order</button>
      </form>
      <div class="sum"><h3>Order summary</h3><div id="sumBody"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

  heroTitle: "Graphic tees, ₹299 each.",
  heroText: "Bold prints, one simple price. Pay online or pay when it arrives with Cash on Delivery.",
  perks: ["Every tee ₹299", "Cash on Delivery", "UPI, card and PayPal"],
  aboutTitle: "About Hemans",
  aboutText: "Hemans Clothing Store sells graphic tees for everyday wear. Replace this text with your own story.",
  footerLeft: "© 2026 Hemans Clothing Store",
  footerRight: "WhatsApp: +91 88495 17050",

  /* PAYMENTS */
  upiId: "chunaraharsh07-2@okicici",  // your UPI ID (the QR photo is in the IMG list at the bottom of the file)
  payeeName: "Harsh Chunara",         // name shown in UPI apps
  razorpayKey: "",                    // paste your Razorpay Key ID (rzp_test_... or rzp_live_...) to turn on card / net banking
  paypalMe: "",                       // your PayPal.Me name (paypal.me/YOURNAME) to turn on PayPal
  usdPerInr: 0.012                    // used only for PayPal: 1 INR in US dollars
};

/* Products: add, remove or edit freely. Photos are embedded in the IMG list at the bottom of this file.
   type: tee | shirt | hoodie | jeans   (draws the built-in illustration)
   img:  optional photo path or URL, e.g. "images/navy-tee.jpg". Leave "" to use the illustration.
   was:  optional old price (shows a strike-through). tag: optional badge text. */
const PRODUCTS = [
  {id:1, name:"Open Your Eyes Tee", category:"Street", type:"tee", price:299, was:0, color:"#1c1c1c", bg:"#E6E8EB", sizes:["S","M","L","XL"], img:IMG.p1, tag:""},
  {id:2, name:"Urban Positive Tee", category:"Street", type:"tee", price:299, was:0, color:"#2F4A3A", bg:"#E4E7E2", sizes:["S","M","L","XL"], img:IMG.p2, tag:""},
  {id:3, name:"Break Rules Tee", category:"Street", type:"tee", price:299, was:0, color:"#2F4A3A", bg:"#E4E7E2", sizes:["S","M","L","XL"], img:IMG.p3, tag:""},
  {id:4, name:"Formula Racing Tee", category:"Racing", type:"tee", price:299, was:0, color:"#4B5A3A", bg:"#E4E7E2", sizes:["S","M","L","XL"], img:IMG.p4, tag:""},
  {id:5, name:"Devil’s Game Tee", category:"Luck", type:"tee", price:299, was:0, color:"#1c1c1c", bg:"#E6E8EB", sizes:["S","M","L","XL"], img:IMG.p5, tag:""},
  {id:6, name:"Raceway Champion Tee", category:"Racing", type:"tee", price:299, was:0, color:"#2F4A3A", bg:"#E4E7E2", sizes:["S","M","L","XL"], img:IMG.p6, tag:""},
  {id:7, name:"Brooklyn New York Tee", category:"Street", type:"tee", price:299, was:0, color:"#1c1c1c", bg:"#E6E8EB", sizes:["S","M","L","XL"], img:IMG.p7, tag:""},
  {id:8, name:"Don’t Quit Tee", category:"Street", type:"tee", price:299, was:0, color:"#2F4A3A", bg:"#E4E7E2", sizes:["S","M","L","XL"], img:IMG.p8, tag:""},
  {id:9, name:"Try Your Luck Tee", category:"Luck", type:"tee", price:299, was:0, color:"#16213A", bg:"#E1E5EC", sizes:["S","M","L","XL"], img:IMG.p9, tag:""},
  {id:10, name:"Explore Tee", category:"Lifestyle", type:"tee", price:299, was:0, color:"#1F4E86", bg:"#E1E7F0", sizes:["S","M","L","XL"], img:IMG.p10, tag:""},
  {id:11, name:"Music Ringer Tee", category:"Lifestyle", type:"tee", price:299, was:0, color:"#F4F4F4", bg:"#E6E8EB", sizes:["S","M","L","XL"], img:IMG.p11, tag:""}
];

/* ===================== Store code (no need to edit below) ===================== */
const $ = s => document.querySelector(s);
const money = n => CONFIG.currency + Number(n).toLocaleString("en-IN");
let cart = [];      // {id, size, qty}
const sel = {};     // chosen size per product
let filter = "All";

try { cart = JSON.parse(localStorage.getItem("hemans_cart") || "[]"); } catch(e) { cart = []; }
const save = () => { try { localStorage.setItem("hemans_cart", JSON.stringify(cart)); } catch(e) {} };

/* Built-in garment illustrations */
function art(type, color){
  const s = 'stroke="rgba(0,0,0,.28)" stroke-width="2" stroke-linejoin="round"';
  const shapes = {
    tee:   `<path d="M60 30 L85 20 Q100 40 115 20 L140 30 L182 72 L158 94 L142 80 L142 200 L58 200 L58 80 L42 94 L18 72 Z" fill="${color}" ${s}/><path d="M85 20 Q100 40 115 20" fill="none" ${s}/>`,
    shirt: `<path d="M60 30 L85 20 L100 44 L115 20 L140 30 L182 78 L160 98 L142 84 L142 202 L58 202 L58 84 L40 98 L18 78 Z" fill="${color}" ${s}/><path d="M100 44 V202" fill="none" ${s}/><path d="M85 20 L100 44 L88 52 L72 32 Z M115 20 L100 44 L112 52 L128 32 Z" fill="rgba(255,255,255,.35)" ${s}/><g fill="rgba(0,0,0,.35)"><circle cx="100" cy="85" r="2.2"/><circle cx="100" cy="120" r="2.2"/><circle cx="100" cy="155" r="2.2"/></g>`,
    hoodie:`<path d="M62 40 L84 28 Q100 52 116 28 L138 40 L184 100 L180 160 L152 160 L142 100 L142 204 L58 204 L58 100 L48 160 L20 160 L16 100 Z" fill="${color}" ${s}/><path d="M72 32 Q100 -2 128 32 Q116 62 100 62 Q84 62 72 32 Z" fill="rgba(0,0,0,.14)" ${s}/><path d="M72 150 H128 L134 180 H66 Z" fill="rgba(0,0,0,.1)" ${s}/>`,
    jeans: `<path d="M54 18 H146 L156 206 H108 L100 90 L92 206 H44 Z" fill="${color}" ${s}/><path d="M54 18 H146 V36 H54 Z" fill="rgba(0,0,0,.15)" ${s}/><path d="M100 36 V90" fill="none" ${s}/>`
  };
  return `<svg viewBox="0 0 200 224" role="img" aria-hidden="true">${shapes[type] || shapes.tee}</svg>`;
}
const pic = p => p.img ? `<img src="${p.img}" alt="${p.name}" loading="lazy">` : art(p.type, p.color);
const find = id => PRODUCTS.find(p => p.id === id);

/* Static text from CONFIG */
function init(){
  document.title = CONFIG.brand;
  $("#logo").innerHTML = CONFIG.brand.replace(" Clothing Store","") + `<small>${CONFIG.tagline}</small>`;
  $("#heroTitle").textContent = CONFIG.heroTitle;
  $("#heroText").textContent = CONFIG.heroText;
  $("#perks").innerHTML = CONFIG.perks.map(t => `<span>${t}</span>`).join("");
  $("#heroArt").innerHTML = PRODUCTS[2] && PRODUCTS[2].img ? pic(PRODUCTS[2]) : art("shirt","#8FB0D6");
  $("#aboutTitle").textContent = CONFIG.aboutTitle;
  $("#aboutText").textContent = CONFIG.aboutText;
  $("#foot1").textContent = CONFIG.footerLeft;
  $("#foot2").textContent = CONFIG.footerRight;
  renderChips(); renderProducts(); renderCart();
  $("#payRzp").style.display = CONFIG.razorpayKey ? "" : "none";
  $("#payPP").style.display = CONFIG.paypalMe ? "" : "none";
  if(CONFIG.razorpayKey){ const s = document.createElement("script"); s.src = "https://checkout.razorpay.com/v1/checkout.js"; document.head.appendChild(s); }
}

function renderChips(){
  const cats = ["All", ...new Set(PRODUCTS.map(p => p.category))];
  $("#chips").innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c===filter}" data-cat="${c}">${c}</button>`).join("");
}

function renderProducts(){
  const list = PRODUCTS.filter(p => filter === "All" || p.category === filter);
  $("#grid").innerHTML = list.map(p => {
    const cur = sel[p.id] || p.sizes[0];
    return `<article class="card">
      <div class="pic" style="background:${p.bg}">${pic(p)}${p.tag ? `<span class="tag">${p.tag}</span>` : ""}</div>
      <div class="info">
        <h3>${p.name}</h3>
        <div class="price">${money(p.price)}${p.was ? `<s>${money(p.was)}</s>` : ""}</div>
        <div class="sizes" role="group" aria-label="Size for ${p.name}">
          ${p.sizes.map(z => `<button class="sz" aria-pressed="${z===cur}" data-id="${p.id}" data-size="${z}">${z}</button>`).join("")}
        </div>
        <button class="add" data-add="${p.id}">Add to cart</button>
      </div>
    </article>`;
  }).join("");
}

/* Cart */
function totals(){
  const sub = cart.reduce((a,l) => a + find(l.id).price * l.qty, 0);
  const ship = sub === 0 || sub >= CONFIG.freeShippingAbove ? 0 : CONFIG.shippingFee;
  return {sub, ship, cod: sub ? CONFIG.codFee : 0, total: sub + ship + (sub ? CONFIG.codFee : 0)};
}

function renderCart(){
  const n = cart.reduce((a,l) => a + l.qty, 0);
  $("#count").textContent = n;
  if(!cart.length){
    $("#lines").innerHTML = `<div class="empty">Your cart is empty.<br>Pick a size and tap Add to cart.</div>`;
    $("#df").style.display = "none";
    return;
  }
  $("#df").style.display = "";
  $("#lines").innerHTML = cart.map((l,i) => {
    const p = find(l.id);
    return `<div class="line">
      <div class="t" style="background:${p.bg}">${pic(p)}</div>
      <div><h4>${p.name}</h4><small>Size ${l.size} · ${money(p.price)}</small>
        <div class="qty"><button data-q="${i}" data-d="-1" aria-label="Decrease">−</button><span>${l.qty}</span><button data-q="${i}" data-d="1" aria-label="Increase">+</button></div></div>
      <div><strong>${money(p.price*l.qty)}</strong><button class="rm" data-rm="${i}">Remove</button></div>
    </div>`;
  }).join("");
  const t = totals();
  const left = CONFIG.freeShippingAbove - t.sub;
  $("#df").innerHTML = `
    <div class="row"><span>Subtotal</span><span>${money(t.sub)}</span></div>
    <div class="row"><span>Delivery</span><span>${t.ship ? money(t.ship) : "Free"}</span></div>
    ${left > 0 ? `<div class="row" style="color:var(--mute);font-size:.8rem"><span>Add ${money(left)} more for free delivery</span></div>` : ""}
    <div class="row tot"><span>Total</span><span>${money(t.total)}</span></div>
    <button class="btn" id="goCo">Proceed to checkout</button>`;
}

function addToCart(id){
  const p = find(id), size = sel[id] || p.sizes[0];
  const ex = cart.find(l => l.id === id && l.size === size);
  ex ? ex.qty++ : cart.push({id, size, qty:1});
  save(); renderCart(); toast(`${p.name} (${size}) added`);
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800);
}

function drawer(open){
  $("#drawer").classList.toggle("on", open);
  $("#scrim").classList.toggle("on", open);
  $("#drawer").setAttribute("aria-hidden", !open);
}

/* Checkout */
function openCheckout(){
  if(!cart.length) return;
  drawer(false);
  const t = totals();
  $("#sumBody").innerHTML = cart.map(l => {
    const p = find(l.id);
    return `<div class="si"><span>${p.name} (${l.size}) × ${l.qty}</span><span>${money(p.price*l.qty)}</span></div>`;
  }).join("") + `
    <div class="row" style="margin-top:12px"><span>Delivery</span><span>${t.ship ? money(t.ship) : "Free"}</span></div>
    ${t.cod ? `<div class="row"><span>COD charge</span><span>${money(t.cod)}</span></div>` : ""}
    <div class="row tot" style="margin-bottom:0"><span>Order total</span><span>${money(t.total)}</span></div>`;
  $("#checkout").classList.add("on");
  payPanel();
  document.body.style.overflow = "hidden";
  $("#checkout").scrollTop = 0;
}
function closeCheckout(){ $("#checkout").classList.remove("on"); document.body.style.overflow = ""; }

const rules = {
  name:    v => v.trim().length >= 2,
  phone:   v => /^[6-9]\d{9}$/.test(v.trim()),
  address: v => v.trim().length >= 10,
  pin:     v => /^[1-9]\d{5}$/.test(v.trim())
};

function payPanel(){
  const v = document.querySelector('input[name=pay]:checked').value, t = totals();
  const box = $("#payPanel"), btn = $("#submitBtn");
  if(v === "UPI"){
    const q = `pa=${encodeURIComponent(CONFIG.upiId)}&pn=${encodeURIComponent(CONFIG.payeeName)}&am=${t.total.toFixed(2)}&cu=INR&tn=${encodeURIComponent(CONFIG.brand + " order")}`;
    box.innerHTML = `<div class="upi"><p>Pay <strong>${money(t.total)}</strong>, then tap “I’ve paid, place order”.</p>
      <div class="upibtns"><a href="tez://upi/pay?${q}">Google Pay</a><a href="phonepe://pay?${q}">PhonePe</a><a href="paytmmp://pay?${q}">Paytm</a><a href="upi://pay?${q}">Other UPI app</a></div>
      <img class="qr" src="${IMG.qr}" alt="UPI QR code">
      <p class="small">Or scan this QR with any UPI app and pay ${money(t.total)}.</p>
      <button type="button" class="copy" id="copyUpi">Copy UPI ID: ${CONFIG.upiId}</button></div>`;
    btn.textContent = "I’ve paid, place order";
  } else if(v === "RAZORPAY"){
    box.innerHTML = `<p class="small" style="margin-bottom:14px">You will pay ${money(t.total)} on Razorpay’s secure page.</p>`;
    btn.textContent = "Pay " + money(t.total);
  } else if(v === "PAYPAL"){
    box.innerHTML = `<p class="small" style="margin-bottom:14px">You will pay about $${(t.total * CONFIG.usdPerInr).toFixed(2)} (${money(t.total)}) on PayPal.</p>`;
    btn.textContent = "Continue to PayPal";
  } else {
    box.innerHTML = "";
    btn.textContent = "Place order";
  }
}

function finish(id, t, c, lines, payText, note, openWA){
  const msg = `New order ${id} - ${CONFIG.brand}\n\n${lines}\n\nDelivery: ${t.ship ? money(t.ship) : "Free"}\nTotal: ${money(t.total)}\nPayment: ${payText}\n\nName: ${c.name}\nPhone: ${c.phone}\nAddress: ${c.address}\nPincode: ${c.pin}`;
  const url = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  cart = []; save(); renderCart();
  $("#coBody").innerHTML = `<div class="done">
    <h2>Order placed</h2>
    <p>Your order number is <strong>${id}</strong>. ${note}</p>
    <p>Tap the button below to send your order details to us on WhatsApp. We confirm every order by message.</p>
    <a class="btn alt" href="${url}" target="_blank" rel="noopener">Send order on WhatsApp</a>
    <button class="btn" style="margin-top:10px;background:none;color:var(--ink);border:1px solid var(--stone)" id="doneBtn">Continue shopping</button>
  </div>`;
  $("#doneBtn").onclick = () => location.reload();
  if(openWA) window.open(url, "_blank", "noopener");
}

function submitOrder(e){
  e.preventDefault();
  const f = e.target; let ok = true;
  Object.keys(rules).forEach(k => {
    const good = rules[k](f[k].value);
    f[k].closest(".f").classList.toggle("bad", !good);
    if(!good) ok = false;
  });
  if(!ok){ const b = f.querySelector(".bad input, .bad textarea"); if(b) b.focus(); return; }

  const t = totals();
  const id = "HM" + Date.now().toString().slice(-7);
  const pay = document.querySelector('input[name=pay]:checked').value;
  const c = {name:f.name.value.trim(), phone:f.phone.value.trim(), address:f.address.value.trim(), pin:f.pin.value.trim()};
  const lines = cart.map(l => `• ${find(l.id).name} | Size ${l.size} | Qty ${l.qty} | ${money(find(l.id).price*l.qty)}`).join("\n");

  if(pay === "RAZORPAY"){
    if(typeof Razorpay === "undefined"){ toast("Payment page is still loading. Try again."); return; }
    new Razorpay({
      key: CONFIG.razorpayKey, amount: Math.round(t.total * 100), currency: "INR",
      name: CONFIG.brand, description: "Order " + id,
      prefill: {name: c.name, contact: c.phone}, notes: {order: id, address: c.address, pincode: c.pin},
      theme: {color: "#16213A"},
      handler: r => finish(id, t, c, lines, `Razorpay, paid (payment ID ${r.razorpay_payment_id})`, "Payment received. Thank you.", true)
    }).open();
  } else if(pay === "PAYPAL"){
    window.open(`https://www.paypal.me/${CONFIG.paypalMe}/${(t.total * CONFIG.usdPerInr).toFixed(2)}USD`, "_blank", "noopener");
    finish(id, t, c, lines, "PayPal (customer will send payment screenshot)", "Finish the payment in the PayPal tab, then send us the screenshot on WhatsApp.", false);
  } else if(pay === "UPI"){
    finish(id, t, c, lines, "UPI (customer will send payment screenshot)", "Please send your payment screenshot on WhatsApp so we can confirm it.", true);
  } else {
    finish(id, t, c, lines, "Cash on Delivery", `Total to pay on delivery: <strong>${money(t.total)}</strong>.`, true);
  }
}

/* Events */
document.addEventListener("click", e => {
  const c = e.target.closest("button, a"); if(!c) return;
  if(c.dataset.cat){ filter = c.dataset.cat; renderChips(); renderProducts(); }
  else if(c.dataset.size){ sel[+c.dataset.id] = c.dataset.size; renderProducts(); }
  else if(c.dataset.add){ addToCart(+c.dataset.add); }
  else if(c.dataset.q){
    const l = cart[+c.dataset.q]; l.qty += +c.dataset.d;
    if(l.qty < 1) cart.splice(+c.dataset.q, 1);
    save(); renderCart();
  }
  else if(c.dataset.rm){ cart.splice(+c.dataset.rm, 1); save(); renderCart(); }
  else if(c.id === "goCo") openCheckout();
  else if(c.id === "copyUpi"){ try{ navigator.clipboard.writeText(CONFIG.upiId); toast("UPI ID copied"); }catch(err){ toast(CONFIG.upiId); } }
});
$("#openCart").onclick = () => drawer(true);
$("#closeCart").onclick = () => drawer(false);
$("#scrim").onclick = () => drawer(false);
$("#closeCo").onclick = closeCheckout;
$("#form").addEventListener("submit", submitOrder);
$("#form").addEventListener("change", e => { if(e.target.name === "pay") payPanel(); });
$("#phone").addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g,""));
$("#pin").addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g,""));
document.addEventListener("keydown", e => { if(e.key === "Escape"){ drawer(false); closeCheckout(); } });

init();
</script>
</body>
